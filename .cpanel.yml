---
# cPanel deployment for valeem.com.
# Copies ONLY the folders and files listed below into public_html.
# It never deletes files and never touches Moodle or anything else in public_html.
# To publish a new folder, add a mkdir + cp pair for it here.
deployment:
  tasks:
    - export DEPLOYPATH=/home/wwwvalee/public_html
    - /bin/mkdir -p $DEPLOYPATH/homeschool-pathways
    - /bin/cp -R homeschool-pathways/. $DEPLOYPATH/homeschool-pathways/
    - /bin/mkdir -p $DEPLOYPATH/new-home
    - /bin/cp -R new-home/. $DEPLOYPATH/new-home/
    - /bin/mkdir -p $DEPLOYPATH/online-tuition-saudi-arabia
    - /bin/cp -R online-tuition-saudi-arabia/. $DEPLOYPATH/online-tuition-saudi-arabia/
    - /bin/mkdir -p $DEPLOYPATH/online-tuition-uae
    - /bin/cp -R online-tuition-uae/. $DEPLOYPATH/online-tuition-uae/
    - /bin/mkdir -p $DEPLOYPATH/online-tuition
    - /bin/cp -R online-tuition/. $DEPLOYPATH/online-tuition/
    - /bin/mkdir -p $DEPLOYPATH/skills-courses
    - /bin/cp -R skills-courses/. $DEPLOYPATH/skills-courses/
    - /bin/mkdir -p $DEPLOYPATH/teach-at-valeem
    - /bin/cp -R teach-at-valeem/. $DEPLOYPATH/teach-at-valeem/
    - /bin/cp root-files/home-index.html $DEPLOYPATH/index.html
    - /bin/cp root-files/htaccess $DEPLOYPATH/.htaccess
    - /bin/cp root-files/llms.txt $DEPLOYPATH/llms.txt
    - /bin/cp root-files/robots.txt $DEPLOYPATH/robots.txt
    - /bin/cp root-files/sitemap.xml $DEPLOYPATH/sitemap.xml
